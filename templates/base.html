<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Doce Darico</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600&family=Hanken+Grotesk:wght@400;500;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body>

    <header>
        <a href="{{ url_for('cliente.index') }}">
            <img class="imagem_logo" src="{{ url_for('static', filename='img/bolo darico.png') }}" alt="Doce Darico">
        </a>
        <nav>
            <a href="{{ url_for('cliente.index') }}" {% if request.endpoint == 'cliente.index' %}class="ativo" aria-current="page"{% endif %}>Cardápio</a>
            <a href="{{ url_for('cliente.sobre') }}" {% if request.endpoint == 'cliente.sobre' %}class="ativo" aria-current="page"{% endif %}>Sobre nós</a>
            <a href="{{ url_for('admin.login') }}">Admin</a>
        </nav>
    </header>

    {% block hero %}{% endblock %}

    <main>
        {% block conteudo %}{% endblock %}
    </main>

    <footer>
        <p>Doce Darico © 2026 — Feito com 🤍</p>
        <p><a href="https://github.com/KaioMungo">GitHub: KaioMungo</a></p>
    </footer>

    <script src="{{ url_for('static', filename='js/main.js') }}"></script>
</body>
</html>
