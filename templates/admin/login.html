{% extends "base.html" %}

{% block conteudo %}

<section class="login">
    <h2>🔒 Área Admin</h2>

    {% if erro %}
    <p class="erro">{{ erro }}</p>
    {% endif %}

    <form action="{{ url_for('admin.login') }}" method="POST">
        <input type="password" name="senha" placeholder="Digite a senha" required>
        <button type="submit">Entrar</button>
    </form>
</section>

{% endblock %}
